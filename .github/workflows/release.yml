name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the Version Packages PR / create the GitHub release
      pull-requests: write # open and update the Version Packages PR
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node (npm registry auth)
        uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Opens/updates the "Version Packages" PR when changesets are pending,
      # and publishes to npm (running prepublishOnly → bun run build) once it merges.
      - name: Create Release PR or publish
        uses: changesets/action@v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
